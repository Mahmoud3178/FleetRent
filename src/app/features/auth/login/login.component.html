<div class="auth-page">
  <div class="auth-card anim-scale-in">
    <div class="auth-header">
      <div class="auth-icon">🚗</div>
      <h2>Welcome back</h2>
      <p>Sign in to manage your bookings</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" formControlName="email" placeholder="you@example.com" />
        @if (form.get('email')?.invalid && form.get('email')?.touched) {
          <div class="form-error">Please enter a valid email</div>
        }
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-field">
          <input
            class="form-control"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••" />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            tabindex="-1">
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-5.5 0-9.6-3.6-11-8 .78-2.53 2.28-4.66 4.24-6.16M9.9 4.24A10.6 10.6 0 0 1 12 4c5.5 0 9.6 3.6 11 8-.53 1.73-1.46 3.31-2.68 4.61" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 2l20 20" stroke-linecap="round"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
        @if (form.get('password')?.invalid && form.get('password')?.touched) {
          <div class="form-error">Password is required</div>
        }
      </div>

      <button class="btn btn-accent btn-block" type="submit" [disabled]="loading()">
        @if (loading()) { <span class="spinner"></span> } @else { Sign in }
      </button>
    </form>

    <p class="text-center text-sm mt-16">
      Don't have an account? <a routerLink="/auth/register" class="link-accent">Create one</a>
    </p>
  </div>
</div>
