<div class="auth-page">
  <div class="auth-card anim-scale-in" style="max-width: 480px;">
    <div class="auth-header">
      <div class="auth-icon">📝</div>
      <h2>Create your account</h2>
      <p>Join FleetRent and start booking cars</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="grid grid-2">
        <div class="form-group">
          <label class="form-label">Full name</label>
          <input class="form-control" formControlName="fullName" placeholder="Ahmed Ali" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone number</label>
          <input class="form-control" formControlName="phoneNumber" placeholder="0100xxxxxxx" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-control" type="email" formControlName="email" placeholder="you@example.com" />
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="password-field">
          <input
            class="form-control"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="At least 6 characters" />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
            tabindex="-1">
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-5.5 0-9.6-3.6-11-8 .78-2.53 2.28-4.66 4.24-6.16M9.9 4.24A10.6 10.6 0 0 1 12 4c5.5 0 9.6 3.6 11 8-.53 1.73-1.46 3.31-2.68 4.61" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 9.5a3 3 0 0 0 4.24 4.24" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 2l20 20" stroke-linecap="round"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
            }
          </button>
        </div>
      </div>

      <div class="grid grid-2">
        <div class="form-group">
          <label class="form-label">Driving license no. <span class="text-muted">(optional)</span></label>
          <input class="form-control" formControlName="drivingLicenseNumber" />
        </div>
        <div class="form-group">
          <label class="form-label">License expiry <span class="text-muted">(optional)</span></label>
          <input class="form-control" type="date" formControlName="licenseExpiryDate" />
        </div>
      </div>

      <button class="btn btn-accent btn-block" type="submit" [disabled]="loading()">
        @if (loading()) { <span class="spinner"></span> } @else { Create account }
      </button>
    </form>

    <p class="text-center text-sm mt-16">
      Already have an account? <a routerLink="/auth/login" class="link-accent">Sign in</a>
    </p>
  </div>
</div>
